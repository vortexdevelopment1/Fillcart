openapi: "3.1.0"
info:
  title: "Fillcart Platform API"
  version: "1.0.0"
  description: "Fillcart Multi-Vendor Commerce Platform API Specification Baseline"
servers:
  - url: http://127.0.0.1:4000
    description: Local development server
paths:
  /.well-known/jwks.json:
    get:
      summary: RFC 8037 JSON Web Key Set (JWKS)
      description: Returns active and unexpired retired Ed25519 public keys used for stateless JWT signature verification.
      operationId: getJwks
      security: []
      responses:
        "200":
          description: Standard RFC 8037 JWKS containing OKP / Ed25519 keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/register:
    post:
      summary: Register Account
      description: Registers a new Customer, Vendor Applicant, or Rider Applicant account with normalized email.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and authenticated session returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: Email/Password Login
      description: Authenticates user credentials with progressive lockout and anti-enumeration.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      summary: Rotate Refresh Token
      description: Atomic zero-grace token rotation. Single-use refresh token is rotated; reuse triggers immediate family revocation.
      operationId: refreshTokens
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Fresh access and refresh tokens returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Revokes the active session family and clears auth cookies.
      operationId: logout
      security: []
      responses:
        "200":
          description: Logged out successfully.
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/otp/send:
    post:
      summary: Send OTP
      description: Generates a 6-digit OTP challenge and delivers via MSG91 SMS gateway.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP challenge initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  cooldownSeconds:
                    type: integer
                    example: 60
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/otp/verify:
    post:
      summary: Verify OTP
      description: Verifies OTP against context-bound HMAC challenge.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OTP verified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  verified:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/internal/auth/verify-session:
    post:
      summary: Canonical Live Central Auth Session Verification
      description: S2S authenticated endpoint where business backends submit intact user JWTs for synchronous status and permission verification.
      operationId: verifySession
      security:
        - S2SAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userAccessToken
              properties:
                userAccessToken:
                  type: string
                requiredPermission:
                  type: string
                  example: "orders:create"
      responses:
        "200":
          description: Live session and permission validation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/auth/verify-settings-access:
    post:
      summary: Verify Admin Password for Sensitive Settings Access
      description: Verifies admin password against Argon2id credentials with progressive rate limiting, returning a short-lived signed grant token for settings modifications.
      operationId: verifySettingsAccess
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password verified and settings grant token issued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - verified
                  - token
                  - expiresIn
                properties:
                  verified:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: 15-minute Ed25519 signed JWT with scope 'settings'
                  expiresIn:
                    type: integer
                    example: 900
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/roles:
    get:
      summary: List Admin Roles and Permission Matrix
      description: Returns all administrative roles and permission profiles with their module-action capability matrix.
      operationId: getAdminRoles
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of roles and permission profiles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        isSystem:
                          type: boolean
                        permissions:
                          type: array
                          items:
                            type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/staff:
    get:
      summary: List Staff Members (Paginated)
      description: Queries all admin accounts with role assignments, status, and activity tracking.
      operationId: getAdminStaff
      security:
        - AdminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, DEACTIVATED]
        - name: profile
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated staff list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - fullName
                        - email
                        - status
                      properties:
                        id:
                          type: string
                        fullName:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        status:
                          type: string
                        role:
                          type: string
                        profile:
                          type: string
                        lastLogin:
                          type: string
                        createdAt:
                          type: string
                  pagination:
                    type: object
                    required:
                      - page
                      - limit
                      - total
                      - totalPages
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/staff/invite:
    post:
      summary: Invite New Admin Staff Member
      description: Creates an AdminInvitation token record and triggers invitation lifecycle.
      operationId: inviteAdminStaff
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - fullName
                - roleId
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                roleId:
                  type: string
                profileId:
                  type: string
      responses:
        "201":
          description: Staff invitation created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - roleId
                  - expiresAt
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  fullName:
                    type: string
                  roleId:
                    type: string
                  profileId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/staff/{id}/status:
    patch:
      summary: Update Staff Active/Inactive Status
      description: Activates, suspends, or deactivates an admin staff member. Enforces self-deactivation and last Super Admin protections.
      operationId: updateStaffStatus
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED, DEACTIVATED]
                reason:
                  type: string
      responses:
        "200":
          description: Staff status updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  suspensionReason:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /health:
    get:
      summary: Root Liveness Probe
      operationId: getRootHealth
      security: []
      responses:
        "200":
          description: Service liveness probe status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /health/ready:
    get:
      summary: Root Readiness Probe
      operationId: getRootReady
      security: []
      responses:
        "200":
          description: Service readiness probe status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Service degraded or dependency unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegradedResponse"

components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Asymmetric Ed25519 JWT access token issued by Central Auth with aud 'admin-backend' and accountType 'ADMIN'.
    S2SAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: Standard API Error Envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phone:
          type: string
          example: "+919876543210"
        accountType:
          type: string
          enum: [CUSTOMER, VENDOR_APPLICANT, RIDER_APPLICANT]
          default: CUSTOMER

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900

    SendOtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+919876543210"
        accountType:
          type: string
          enum: [CUSTOMER, VENDOR_APPLICANT, RIDER_APPLICANT]
          default: CUSTOMER
        purpose:
          type: string
          enum: [REGISTRATION, LOGIN, PHONE_VERIFICATION]
          default: LOGIN

    VerifyOtpRequest:
      type: object
      required:
        - challengeId
        - otp
        - phone
      properties:
        challengeId:
          type: string
          format: uuid
        otp:
          type: string
          example: "123456"
        phone:
          type: string
        accountType:
          type: string
          enum: [CUSTOMER, VENDOR_APPLICANT, RIDER_APPLICANT]
          default: CUSTOMER
        purpose:
          type: string
          default: LOGIN

    LiveSessionResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        authorized:
          type: boolean
        userId:
          type: string
        sessionId:
          type: string
        accountType:
          type: string
        status:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        reason:
          type: string

    JwksKey:
      type: object
      required:
        - kty
        - crv
        - x
        - kid
      properties:
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        x:
          type: string
        kid:
          type: string
        use:
          type: string
        alg:
          type: string

    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JwksKey"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          enum: [healthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string

    ReadyResponse:
      type: object
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [connected]
        timestamp:
          type: string
          format: date-time

    DegradedResponse:
      type: object
      required:
        - status
        - database
        - message
        - timestamp
      properties:
        status:
          type: string
          enum: [degraded]
        database:
          type: string
          enum: [disconnected]
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    CategoryTreeItem:
      type: object
      required: [id, name, slug, iconName, displayOrder, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        iconName:
          type: string
        parentCategoryId:
          type: string
          format: uuid
        displayOrder:
          type: integer
        isActive:
          type: boolean
        subCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTreeItem"

    CreateCategoryRequest:
      type: object
      required: [name, iconName]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        iconName:
          type: string
        parentCategoryId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        iconName:
          type: string
        parentCategoryId:
          type: string
          format: uuid
        displayOrder:
          type: integer
        isActive:
          type: boolean

    CreateVariantInput:
      type: object
      required: [sku, variantName, unitQuantity, unitType, mrpPaisa, salePricePaisa]
      properties:
        sku:
          type: string
        barcode:
          type: string
        variantName:
          type: string
        unitQuantity:
          type: number
        unitType:
          type: string
          enum: [GRAM, KG, MILLILITER, LITER, PIECE, PACK, METER]
        mrpPaisa:
          type: string
          description: String of paisa (e.g. "19900" for INR 199.00)
        salePricePaisa:
          type: string
          description: String of paisa (e.g. "17900" for INR 179.00)
        discountPct:
          type: integer
          default: 0
        isDefault:
          type: boolean
          default: false

    CreateProductRequest:
      type: object
      required: [name, categoryId, variants]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        hsnCode:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]
          default: DRAFT
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CreateVariantInput"

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        hsnCode:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CreateVariantInput"
