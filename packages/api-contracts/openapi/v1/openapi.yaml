components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Asymmetric Ed25519 JWT access token issued by Central Auth with aud 'admin-backend' and accountType 'ADMIN'.
    S2SAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ErrorResponse:
      description: Standard API Error Envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        phone:
          type: string
          example: "+919876543210"
        accountType:
          type: string
          enum: [CUSTOMER, VENDOR_APPLICANT, RIDER_APPLICANT]
          default: CUSTOMER

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900

    SendOtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+919876543210"
        accountType:
          type: string
          enum: [CUSTOMER, VENDOR_APPLICANT, RIDER_APPLICANT]
          default: CUSTOMER
        purpose:
          type: string
          enum: [REGISTRATION, LOGIN, PHONE_VERIFICATION]
          default: LOGIN

    VerifyOtpRequest:
      type: object
      required:
        - challengeId
        - otp
        - phone
      properties:
        challengeId:
          type: string
          format: uuid
        otp:
          type: string
          example: "123456"
        phone:
          type: string
        accountType:
          type: string
          enum: [CUSTOMER, VENDOR_APPLICANT, RIDER_APPLICANT]
          default: CUSTOMER
        purpose:
          type: string
          default: LOGIN

    LiveSessionResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
        authorized:
          type: boolean
        userId:
          type: string
        sessionId:
          type: string
        accountType:
          type: string
        status:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        reason:
          type: string

    JwksKey:
      type: object
      required:
        - kty
        - crv
        - x
        - kid
      properties:
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        x:
          type: string
        kid:
          type: string
        use:
          type: string
        alg:
          type: string

    JwksResponse:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JwksKey"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          enum: [healthy]
        timestamp:
          type: string
          format: date-time
        version:
          type: string

    ReadyResponse:
      type: object
      required:
        - status
        - database
        - timestamp
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [connected]
        timestamp:
          type: string
          format: date-time

    DegradedResponse:
      type: object
      required:
        - status
        - database
        - message
        - timestamp
      properties:
        status:
          type: string
          enum: [degraded]
        database:
          type: string
          enum: [disconnected]
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorDetail:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    CategoryTreeItem:
      type: object
      required: [id, name, slug, iconName, displayOrder, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        iconName:
          type: string
        parentCategoryId:
          type: string
          format: uuid
        displayOrder:
          type: integer
        isActive:
          type: boolean
        subCategories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTreeItem"

    CreateCategoryRequest:
      type: object
      required: [name, iconName]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        iconName:
          type: string
        parentCategoryId:
          type: string
          format: uuid
        displayOrder:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        iconName:
          type: string
        parentCategoryId:
          type: string
          format: uuid
        displayOrder:
          type: integer
        isActive:
          type: boolean

    CreateVariantInput:
      type: object
      required: [sku, variantName, unitQuantity, unitType, mrpPaisa, salePricePaisa]
      properties:
        sku:
          type: string
        barcode:
          type: string
        variantName:
          type: string
        unitQuantity:
          type: number
        unitType:
          type: string
          enum: [GRAM, KG, MILLILITER, LITER, PIECE, PACK, METER]
        mrpPaisa:
          type: string
          description: String of paisa (e.g. "19900" for INR 199.00)
        salePricePaisa:
          type: string
          description: String of paisa (e.g. "17900" for INR 179.00)
        discountPct:
          type: integer
          default: 0
        isDefault:
          type: boolean
          default: false

    CreateProductRequest:
      type: object
      required: [name, categoryId, variants]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        hsnCode:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]
          default: DRAFT
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CreateVariantInput"

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        hsnCode:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CreateVariantInput"

    SettingsTabId:
      type: string
      enum:
        - GENERAL
        - ORDERS
        - ONBOARDING
        - FINANCE
        - NOTIFICATIONS
        - SECURITY

    UpdateSettingsGroupRequest:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          description: Key-value settings matching the target SettingsTabId structure

    # ---------------------------------------------------------------------------
    # New Admin Modules Schemas
    # ---------------------------------------------------------------------------
    ReviewDocumentRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED, REUPLOAD_REQUESTED]
        reason:
          type: string
        remarks:
          type: string

    ApplicantDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
        notes:
          type: string

    UpdateVendorStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INACTIVE, PENDING_ONBOARDING]
        reason:
          type: string
        remarks:
          type: string

    UpdateVendorCommissionRequest:
      type: object
      required: [commissionPct]
      properties:
        commissionPct:
          type: number
          minimum: 0
          maximum: 100
        reason:
          type: string

    UpdateRiderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INACTIVE, PENDING_ONBOARDING]
        reason:
          type: string
        remarks:
          type: string

    UpdateRiderAvailabilityRequest:
      type: object
      required: [availability]
      properties:
        availability:
          type: string
          enum: [ONLINE, OFFLINE, ON_DELIVERY]
        reason:
          type: string

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        remarks:
          type: string
        triggerRefund:
          type: boolean
          default: true

    AssignRiderRequest:
      type: object
      required: [riderId]
      properties:
        riderId:
          type: string
          format: uuid
        notes:
          type: string

    CreateCommissionRuleRequest:
      type: object
      required: [category, percentage]
      properties:
        category:
          type: string
        percentage:
          type: number
          minimum: 0
          maximum: 100
