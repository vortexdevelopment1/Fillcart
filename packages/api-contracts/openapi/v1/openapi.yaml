openapi: "3.1.0"
info:
  title: "Fillcart Platform API"
  version: "1.0.0"
  description: "Fillcart Multi-Vendor Commerce Platform API Specification Baseline"
servers:
  - url: http://127.0.0.1:4000
    description: Local development server
paths:
  /.well-known/jwks.json:
    get:
      summary: RFC 8037 JSON Web Key Set (JWKS)
      description: Returns active and unexpired retired Ed25519 public keys used for stateless JWT signature verification.
      operationId: getJwks
      security: []
      responses:
        "200":
          description: Standard RFC 8037 JWKS containing OKP / Ed25519 keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/register:
    post:
      summary: Register Account
      description: Registers a new Customer, Vendor Applicant, or Rider Applicant account with normalized email.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and authenticated session returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: Email/Password Login
      description: Authenticates user credentials with progressive lockout and anti-enumeration.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      summary: Rotate Refresh Token
      description: Atomic zero-grace token rotation. Single-use refresh token is rotated; reuse triggers immediate family revocation.
      operationId: refreshTokens
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Fresh access and refresh tokens returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: User Logout
      description: Revokes the active session family and clears auth cookies.
      operationId: logout
      security: []
      responses:
        "200":
          description: Logged out successfully.
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/otp/send:
    post:
      summary: Send OTP
      description: Generates a 6-digit OTP challenge and delivers via MSG91 SMS gateway.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
      responses:
        "200":
          description: OTP challenge initiated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId:
                    type: string
                    format: uuid
                  cooldownSeconds:
                    type: integer
                    example: 60
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/auth/otp/verify:
    post:
      summary: Verify OTP
      description: Verifies OTP against context-bound HMAC challenge.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OTP verified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  verified:
                    type: boolean
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/internal/auth/verify-session:
    post:
      summary: Canonical Live Central Auth Session Verification
      description: S2S authenticated endpoint where business backends submit intact user JWTs for synchronous status and permission verification.
      operationId: verifySession
      security:
        - S2SAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userAccessToken
              properties:
                userAccessToken:
                  type: string
                requiredPermission:
                  type: string
                  example: "orders:create"
      responses:
        "200":
          description: Live session and permission validation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/auth/verify-settings-access:
    post:
      summary: Verify Admin Password for Sensitive Settings Access
      description: Verifies admin password against Argon2id credentials with progressive rate limiting, returning a short-lived signed grant token for settings modifications.
      operationId: verifySettingsAccess
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password verified and settings grant token issued.
          content:
            application/json:
              schema:
                type: object
                required:
                  - verified
                  - token
                  - expiresIn
                properties:
                  verified:
                    type: boolean
                    example: true
                  token:
                    type: string
                    description: 15-minute Ed25519 signed JWT with scope 'settings'
                  expiresIn:
                    type: integer
                    example: 900
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/roles:
    get:
      summary: List Admin Roles and Permission Matrix
      description: Returns all administrative roles and permission profiles with their module-action capability matrix.
      operationId: getAdminRoles
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: List of roles and permission profiles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - name
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
                        isSystem:
                          type: boolean
                        permissions:
                          type: array
                          items:
                            type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/staff:
    get:
      summary: List Staff Members (Paginated)
      description: Queries all admin accounts with role assignments, status, and activity tracking.
      operationId: getAdminStaff
      security:
        - AdminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, SUSPENDED, DEACTIVATED]
        - name: profile
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated staff list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - fullName
                        - email
                        - status
                      properties:
                        id:
                          type: string
                        fullName:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        status:
                          type: string
                        role:
                          type: string
                        profile:
                          type: string
                        lastLogin:
                          type: string
                        createdAt:
                          type: string
                  pagination:
                    type: object
                    required:
                      - page
                      - limit
                      - total
                      - totalPages
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/staff/invite:
    post:
      summary: Invite New Admin Staff Member
      description: Creates an AdminInvitation token record and triggers invitation lifecycle.
      operationId: inviteAdminStaff
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - fullName
                - roleId
              properties:
                email:
                  type: string
                  format: email
                fullName:
                  type: string
                roleId:
                  type: string
                profileId:
                  type: string
      responses:
        "201":
          description: Staff invitation created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - roleId
                  - expiresAt
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  fullName:
                    type: string
                  roleId:
                    type: string
                  profileId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/staff/{id}/status:
    patch:
      summary: Update Staff Active/Inactive Status
      description: Activates, suspends, or deactivates an admin staff member. Enforces self-deactivation and last Super Admin protections.
      operationId: updateStaffStatus
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, SUSPENDED, DEACTIVATED]
                reason:
                  type: string
      responses:
        "200":
          description: Staff status updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  suspensionReason:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /health:
    get:
      summary: Root Liveness Probe
      operationId: getRootHealth
      security: []
      responses:
        "200":
          description: Service liveness probe status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /health/ready:
    get:
      summary: Root Readiness Probe
      operationId: getRootReady
      security: []
      responses:
        "200":
          description: Service readiness probe status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          description: Service degraded or dependency unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegradedResponse"

  /api/v1/admin/categories:
    get:
      summary: Get Category Hierarchy Tree
      operationId: getAdminCategories
      security:
        - AdminBearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Hierarchical category tree
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      summary: Create Category
      operationId: createAdminCategory
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/admin/categories/reorder:
    put:
      summary: Reorder Categories
      operationId: reorderAdminCategories
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, displayOrder]
                    properties:
                      id: { type: string, format: uuid }
                      displayOrder: { type: integer }
                      parentCategoryId: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Categories reordered

  /api/v1/admin/categories/{id}:
    get:
      summary: Get Category Details
      operationId: getAdminCategoryById
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Category details
    put:
      summary: Update Category
      operationId: updateAdminCategory
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated

  /api/v1/admin/categories/{id}/status:
    patch:
      summary: Toggle Category Active Status
      operationId: toggleAdminCategoryStatus
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Category status updated

  /api/v1/admin/brands:
    get:
      summary: List Brands (Paginated)
      operationId: getAdminBrands
      security:
        - AdminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated brands list
    post:
      summary: Create Brand
      operationId: createAdminBrand
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                logoUrl: { type: string }
                website: { type: string }
                isActive: { type: boolean, default: true }
      responses:
        "201":
          description: Brand created

  /api/v1/admin/brands/{id}:
    get:
      summary: Get Brand Details
      operationId: getAdminBrandById
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Brand details
    put:
      summary: Update Brand
      operationId: updateAdminBrand
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
                logoUrl: { type: string }
                website: { type: string }
                isActive: { type: boolean }
      responses:
        "200":
          description: Brand updated

  /api/v1/admin/brands/{id}/status:
    patch:
      summary: Toggle Brand Status
      operationId: toggleAdminBrandStatus
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        "200":
          description: Brand status updated

  /api/v1/admin/products:
    get:
      summary: List Products (Paginated & Filterable)
      operationId: getAdminProducts
      security:
        - AdminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: brandId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED] }
        - name: moderationStatus
          in: query
          schema: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED, CHANGES_REQUESTED] }
        - name: lowStock
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated products list
    post:
      summary: Create Product with Variants
      operationId: createAdminProduct
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created

  /api/v1/admin/products/bulk-status:
    post:
      summary: Bulk Update Product Status
      operationId: bulkUpdateAdminProductStatus
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds, status]
              properties:
                productIds:
                  type: array
                  items: { type: string, format: uuid }
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]
      responses:
        "200":
          description: Bulk status updated

  /api/v1/admin/products/{id}:
    get:
      summary: Get Product Details
      operationId: getAdminProductById
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product details with string paisa
    put:
      summary: Update Product
      operationId: updateAdminProduct
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated

  /api/v1/admin/products/{id}/status:
    patch:
      summary: Toggle Product Status
      operationId: toggleAdminProductStatus
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, DRAFT, ARCHIVED]
      responses:
        "200":
          description: Product status updated

  /api/v1/admin/products/{id}/moderate:
    post:
      summary: Moderate Product
      operationId: moderateAdminProduct
      security:
        - AdminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, REQUEST_CHANGES]
                reason:
                  type: string
      responses:
        "200":
          description: Moderation action applied

  /api/v1/admin/inventory:
    get:
      summary: Read Inventory Balances
      operationId: getAdminInventory
      security:
        - AdminBearerAuth: []
      parameters:
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: variantId
          in: query
          schema: { type: string, format: uuid }
        - name: lowStock
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Inventory balances list

  /api/v1/admin/inventory/adjust:
    post:
      summary: Adjust Stock Balance
      operationId: adjustAdminInventory
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, variantId, adjustmentQuantity, reason]
              properties:
                storeId: { type: string, format: uuid }
                variantId: { type: string, format: uuid }
                adjustmentQuantity: { type: integer }
                reason: { type: string, minLength: 3 }
      responses:
        "200":
          description: Stock adjusted

  /api/v1/admin/settings/{group}:
    get:
      summary: Get Settings Group
      description: Returns configuration for one of the 6 settings tabs with secrets masked.
      operationId: getAdminSettingsGroup
      security:
        - AdminBearerAuth: []
        - SettingsGrantHeader: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SettingsTabId"
      responses:
        "200":
          description: Settings group configuration
          content:
            application/json:
              schema:
                type: object
                required: [group, settings]
                properties:
                  group:
                    $ref: "#/components/schemas/SettingsTabId"
                  settings:
                    type: object
    put:
      summary: Update Settings Group
      description: Updates configuration for one of the 6 settings tabs. Requires x-settings-grant header.
      operationId: updateAdminSettingsGroup
      security:
        - AdminBearerAuth: []
        - SettingsGrantHeader: []
      parameters:
        - name: group
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SettingsTabId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsGroupRequest"
      responses:
        "200":
          description: Settings updated successfully

  /api/v1/admin/audit-logs:
    get:
      summary: List Admin Audit Logs
      description: Queries append-only admin audit log with filters and pagination.
      operationId: getAdminAuditLogs
      security:
        - AdminBearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: adminUserId
          in: query
          schema: { type: string, format: uuid }
        - name: targetType
          in: query
          schema: { type: string }
        - name: targetId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated audit logs

  # ---------------------------------------------------------------------------
  # B.1 Dashboard Module
  # ---------------------------------------------------------------------------
