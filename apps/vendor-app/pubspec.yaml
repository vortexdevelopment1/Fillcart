name: fillcart_vendor
description: Fillcart Vendor Mobile Application (Flutter MVP).
version: 0.0.1
homepage: https://github.com/vortexdevelopment1/Fillcart
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  fillcart_shared:
    path: ../../packages/flutter_shared
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/logos/splash_logo.png
    - assets/illustrations/
