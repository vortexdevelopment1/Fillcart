name: fillcart_customer
description: Fillcart Customer Mobile Application (Flutter).
version: 0.0.1
homepage: https://github.com/vortexdevelopment1/Fillcart
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  fillcart_shared:
    path: ../../packages/flutter_shared
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home-image/
    - assets/images/home-images/
    - assets/card-icons/
    - assets/icons/
