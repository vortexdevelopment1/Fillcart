name: fillcart_rider
description: Fillcart Delivery Rider Mobile Application (Flutter).
version: 0.0.1
homepage: https://github.com/vortexdevelopment1/Fillcart
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  fillcart_shared:
    path: ../../packages/flutter_shared
  flutter_bloc: ^9.1.2
  bloc: ^9.2.2
  equatable: ^3.0.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/onboarding/
    - assets/kyc/
    - assets/icons/
    - assets/images/
